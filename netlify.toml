# Netlify собирает проект и публикует результат сборки.
#
# Без этого файла Netlify выкладывает корень репозитория как есть, и в браузер
# уходит исходный index.html со ссылкой на `/src/main.ts` — TypeScript, который
# браузер выполнить не может. Отсюда же берутся 404 на иконки и манифест:
# содержимое public/ попадает в корень только после сборки.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Service worker не должен кэшироваться: иначе браузер продолжит отдавать
# старую версию воркера и игра не узнает об обновлении.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json"

# Хэшированные ассеты неизменяемы — их можно кэшировать навсегда.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
