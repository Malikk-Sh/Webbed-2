<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#16303c" />
      <stop offset="55%" stop-color="#0c1620" />
      <stop offset="100%" stop-color="#05080c" />
    </radialGradient>
    <linearGradient id="silk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bfeaf6" />
      <stop offset="100%" stop-color="#6fd8bb" />
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <g filter="url(#glow)" stroke="url(#silk)" fill="none" stroke-linecap="round">
    <!-- радиальные нити -->
    <g stroke-width="4" opacity="0.75">
      <path d="M256 256 L256 74" />
      <path d="M256 256 L385 127" />
      <path d="M256 256 L438 256" />
      <path d="M256 256 L385 385" />
      <path d="M256 256 L256 438" />
      <path d="M256 256 L127 385" />
      <path d="M256 256 L74 256" />
      <path d="M256 256 L127 127" />
    </g>
    <!-- витки спирали -->
    <g stroke-width="5" opacity="0.92">
      <path d="M256 132 Q300 152 344 168 Q328 212 344 256 Q328 300 344 344 Q300 360 256 380 Q212 360 168 344 Q184 300 168 256 Q184 212 168 168 Q212 152 256 132 Z" />
      <path d="M256 196 Q286 210 302 226 Q292 242 302 256 Q292 270 302 286 Q286 302 256 316 Q226 302 210 286 Q220 270 210 256 Q220 242 210 226 Q226 210 256 196 Z" opacity="0.7" />
    </g>
  </g>

  <!-- капля росы -->
  <g filter="url(#glow)">
    <circle cx="344" cy="168" r="11" fill="#ffd794" opacity="0.95" />
    <circle cx="340" cy="164" r="4" fill="#fff6e2" />
  </g>
</svg>
